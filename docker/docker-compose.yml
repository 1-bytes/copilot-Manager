services:
  copilot-manager:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/1-bytes/copilot-manager:latest
    container_name: copilot-manager
    network_mode: host
    volumes:
      - ~/.copilot_manager:/root/.copilot_manager
    environment:
      - LOG_LEVEL=info
      - API_KEY=test  # [重要] 请设置您的安全密钥
      - ABV_BIND_LOCAL_ONLY=true
    restart: unless-stopped
